services:
  portfolio:
    build: .
    image: theogrsjn/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    # Port exposé sur l'hôte : à adapter à ton reverse proxy / tunnel Cloudflare.
    ports:
      - "${PORTFOLIO_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
